# =============================================================================
# GSST — Release Pipeline
# =============================================================================
# Triggered on version tags (v*). Builds release artifacts and creates a
# GitHub Release with source archives and build artifacts.
# =============================================================================

name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-24.04
        container:
            image: nvidia/cuda:12.6.3-devel-ubuntu24.04
        env:
            DEBIAN_FRONTEND: noninteractive

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install build dependencies
              run: |
                  apt-get update -qq
                  apt-get install -y --no-install-recommends \
                    cmake ninja-build g++ git ca-certificates \
                    libomp-dev

            - name: Extract version from tag
              id: version
              run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Configure
              run: >
                  cmake -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DCMAKE_CUDA_ARCHITECTURES="80;86;89;90"
                  -DGSST_BUILD_TESTS=OFF
                  -DGSST_BUILD_BENCHMARKS=OFF
                  -DGSST_BUILD_EXAMPLES=OFF
                  -DGSST_INSTALL=ON
                  -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

            - name: Build
              run: cmake --build build --parallel

            - name: Install
              run: cmake --install build

            - name: Package
              run: |
                  cd ${{ github.workspace }}/_install
                  tar czf ${{ github.workspace }}/gsst-${{ steps.version.outputs.VERSION }}-linux-x64-cuda12.tar.gz .

            - name: Generate changelog
              id: changelog
              run: |
                  # Get previous tag
                  PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
                  if [ -z "$PREV_TAG" ]; then
                    echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
                    echo "Initial release" >> "$GITHUB_OUTPUT"
                    echo "EOF" >> "$GITHUB_OUTPUT"
                  else
                    echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
                    git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" >> "$GITHUB_OUTPUT"
                    echo "" >> "$GITHUB_OUTPUT"
                    echo "EOF" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: GSST ${{ steps.version.outputs.VERSION }}
                  body: |
                      ## GSST ${{ steps.version.outputs.VERSION }}

                      ### Changes
                      ${{ steps.changelog.outputs.CHANGELOG }}

                      ### Installation
                      ```bash
                      tar xzf gsst-${{ steps.version.outputs.VERSION }}-linux-x64-cuda12.tar.gz -C /usr/local
                      ```

                      Or build from source:
                      ```bash
                      cmake -B build -DCMAKE_BUILD_TYPE=Release
                      cmake --build build --parallel
                      cmake --install build
                      ```
                  files: |
                      gsst-${{ steps.version.outputs.VERSION }}-linux-x64-cuda12.tar.gz
                  draft: false
                  prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
